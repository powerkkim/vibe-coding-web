name: Deploy worker (Cloudflare)

# 응답 생성 중계 서버(worker/)를 Cloudflare Workers 에 배포한다.
# worker/ 가 바뀌어 main 에 올라갈 때, 또는 Actions 화면에서 직접 실행할 때만 돈다.
# 필요한 레포 Secrets: CLOUDFLARE_API_TOKEN(Edit Cloudflare Workers), CLOUDFLARE_ACCOUNT_ID
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install wrangler
        working-directory: worker
        run: npm ci

      - name: Deploy
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
