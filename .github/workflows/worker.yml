name: Deploy worker (Cloudflare)

# 응답 생성 중계 서버(worker/)를 Cloudflare Workers 에 배포한다.
# worker/ 가 바뀌어 main 에 올라갈 때, 또는 Actions 화면에서 직접 실행할 때만 돈다.
# 필요: Secrets CLOUDFLARE_API_TOKEN(Edit Cloudflare Workers, 꼭 Secret), CLOUDFLARE_ACCOUNT_ID(Secret 또는 Variable)
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # 단계 조건(if)에서 비밀값 유무를 보려면 작업 수준 env 로 꺼내 둬야 한다.
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # wrangler 4 는 Node 22 이상이 필요하다
          node-version: 22
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install wrangler
        working-directory: worker
        run: npm ci

      - name: Deploy
        working-directory: worker
        # 구글 클라이언트 ID 는 공개값이라 변수로 넘긴다(드라이브 로그인 유지용).
        run: npx wrangler deploy ${{ vars.GOOGLE_CLIENT_ID && format('--var GOOGLE_CLIENT_ID:{0}', vars.GOOGLE_CLIENT_ID) || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}

      # 드라이브 로그인 유지(갱신 토큰)용 구글 클라이언트 비밀값. 레포 Secret GOOGLE_CLIENT_SECRET 이 있을 때만 넣는다.
      - name: Set Google client secret
        working-directory: worker
        if: ${{ env.GOOGLE_CLIENT_SECRET != '' }}
        run: printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
