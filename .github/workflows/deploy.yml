name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # 대화 저장 서버(R2). 비워 두면 대화 저장 = Google 드라이브.
          VITE_CHAT_SERVER_URL: ${{ vars.CHAT_SERVER_URL }}
          # 응답 생성 중계 서버(worker/, Cloudflare). 폰 앱이 백그라운드로 가도 서버가 끝까지 받는다.
          # 레포 변수 GENERATION_SERVER_URL 로 정할 수 있고, 'off' 면 브라우저 직접 호출로 돌아간다.
          # 서버(worker) 배포가 확인되기 전까지는 비워 둔다(브라우저 직접 호출).
          VITE_GENERATION_SERVER_URL: ${{ vars.GENERATION_SERVER_URL == 'off' && '' || vars.GENERATION_SERVER_URL || '' }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          # Google 선택창(드라이브 파일 가져오기). 없으면 가져오기 기능만 숨겨진다.
          VITE_GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY }}
          VITE_GOOGLE_APP_ID: ${{ vars.GOOGLE_APP_ID }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
